<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Complete your Ruth Jewels order."><title>Checkout | Ruth Jewels</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
  <body><div class="announcement">Gift-ready packaging &nbsp;·&nbsp; Delivery across India &nbsp;·&nbsp; Prices in INR</div><header class="site-header" data-header></header><main class="page-shell checkout-page"><p class="eyebrow">Delivery details</p><h1>Complete your request.</h1><div class="checkout-grid"><form class="checkout-form" data-checkout-form><h2>Contact and delivery</h2><label>Email address<input required type="email" autocomplete="email" placeholder="you@example.com"></label><div class="form-row"><label>First name<input required autocomplete="given-name" placeholder="First name"></label><label>Last name<input required autocomplete="family-name" placeholder="Last name"></label></div><label>House / flat, street and landmark<input required autocomplete="street-address" placeholder="Full delivery address"></label><div class="form-row"><label>City<input required autocomplete="address-level2" placeholder="City"></label><label>PIN code<input required inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code" placeholder="6-digit PIN code"></label></div><div class="form-row"><label>State<input required autocomplete="address-level1" placeholder="State"></label><label>Indian mobile number<input required type="tel" autocomplete="tel" placeholder="+91 98765 43210"></label></div><h2>Payment status</h2><div class="payment-note">This is a demonstration checkout. It does not collect card, UPI, or banking details and will not create a paid order.</div><button class="button button--primary" type="submit">Submit demonstration order request</button></form><aside class="order-summary" data-checkout-summary></aside></div></main><footer data-footer></footer><script src="app.js"></script></body>
</html>
